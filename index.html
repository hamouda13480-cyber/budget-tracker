<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاريف الشهور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-header">
        <h1>📊 مصاريف الشهور</h1>
        
        <!-- قسم الإدخال المحدث (اسم الحاجة + السعر) -->
        <div class="expense-form">
            <input type="text" id="item-name" placeholder="اسم الحاجة التي اشتريتها...">
            <input type="number" id="item-price" placeholder="السعر..." step="any">
            <button id="add-btn">إضافة</button>
        </div>
    </div>

    <!-- شبكة الشهور (البادلت) -->
    <div class="boards-grid" id="boards-grid">
        <!-- يتم توليد كروت الشهور هنا تلقائياً -->
    </div>

    <script src="script.js"></script>
</body>
</html>
